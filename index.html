<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فاتورة - اساس البناء</title>
<style>
  :root {
    --black: #000000;
    --orange: #ffbc5a;
    --grey: #dcdcdc;
    --ink: #111111;
    --line: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #e9e9e9;
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Noto Sans Arabic", Arial, sans-serif;
  }

  /* شريط الأزرار - ما يطلع بالـ PDF */
  .toolbar {
    display: flex; gap: 10px; justify-content: center;
    padding: 12px; position: sticky; top: 0; background: #fff;
    border-bottom: 1px solid #ccc; z-index: 5;
  }
  .toolbar button {
    font: inherit; font-weight: 700; padding: 10px 18px;
    border: 2px solid var(--black); background: var(--orange);
    border-radius: 8px; cursor: pointer;
  }
  .toolbar button.secondary { background: #fff; }
  .toolbar button:focus-visible { outline: 3px solid #0057d8; outline-offset: 2px; }

  /* الورقة */
  .sheet {
    width: min(210mm, 100%);
    min-height: 297mm;
    margin: 16px auto;
    background: #fff;
    position: relative;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* الهيدر */
  .header {
    direction: ltr;
    background: var(--black);
    height: 150px;
    position: relative;
    display: flex; align-items: center;
    padding: 0 22px;
  }
  .header .slant-orange {
    position: absolute; left: 50%; top: 0; height: 100%; width: 120px;
    transform: translateX(-125px) skewX(12deg);
    background: var(--orange);
    border-radius: 0 0 0 30px;
  }
  .header .slant-grey {
    position: absolute; right: -50px; top: 0; height: 100%; width: calc(24% + 50px);
    background: var(--grey);
    transform: skewX(-12deg);
  }
  .header .tagline {
    position: relative; color: #fff; direction: rtl; max-width: 235px; line-height: 1.5;
  }
  .header .tagline strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  .header .tagline span { display: block; font-weight: 400; font-size: .8rem; color: #ddd; }
  .logo {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 150px; height: 150px;
    background: var(--black);
    border: 4px solid #cfcfcf;
    border-radius: 24px;
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; display: block; object-fit: cover; }

  /* الرقم والتاريخ */
  .meta {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px 0;
  }
  .meta label { font-weight: 800; font-size: 1.1rem; }
  .date-group { display: flex; align-items: center; gap: 8px; }
  .date-group input { width: 3.2em; text-align: center; font-size: 1rem; }
  .date-group .year { width: 4.2em; }
  .invoice-no {
    width: 5em; font-size: 1.8rem; font-weight: 800; text-align: center;
  }

  .client {
    display: flex; align-items: center; gap: 10px;
    padding: 28px 28px 14px; font-weight: 800; font-size: 1.1rem;
  }
  .client input { flex: 0 1 320px; }

  /* حقول الإدخال بدون إطار */
  input {
    font: inherit; color: inherit; background: transparent;
    border: 0; border-bottom: 1px dashed #888; padding: 4px 2px; min-width: 0;
  }
  input:focus-visible { outline: 2px solid #0057d8; outline-offset: 1px; background: #f3f8ff; }

  /* الجدول */
  .table-wrap { padding: 0 28px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border: 1px solid var(--line); text-align: center; padding: 0; }
  th {
    background: var(--orange); font-weight: 800; font-size: .95rem;
    padding: 10px 4px; height: 54px;
  }
  td { height: 44px; vertical-align: middle; }
  /* خلايا تكبر مع الكتابة */
  .cell {
    display: block; width: 100%; border: 0; text-align: center;
    padding: 10px 4px; font: inherit; line-height: 1.5; color: inherit;
    background: transparent; resize: none; overflow: hidden;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
    min-height: 44px; border-radius: 0;
  }
  .cell:focus-visible { outline: 2px solid #0057d8; outline-offset: -2px; background: #f3f8ff; }
  th small { display: block; font-size: .7rem; font-weight: 700; margin-top: 2px; }
  .totals .cur { font-weight: 800; font-size: 1rem; }
  td.n { font-size: .9rem; }
  col.c-n { width: 7%; } col.c-item { width: 30%; } col.c-qty { width: 11%; }
  col.c-price { width: 15%; } col.c-amount { width: 17%; } col.c-note { width: 20%; }
  td.item .cell { text-align: right; padding-right: 8px; }

  /* المجموع والتوقيع */
  .totals {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 28px 0; gap: 16px; font-weight: 800;
  }
  .totals .sign { flex: 0 0 38%; }
  .totals .sign input { width: 70%; }
  .totals .sum { flex: 0 0 46%; display: flex; gap: 10px; align-items: center; }
  .totals .sum input {
    flex: 1; text-align: center; font-weight: 800; font-size: 1.15rem;
    border-bottom: 2px solid #0b5a7a;
  }

  /* الفوتر */
  .spacer { flex: 1; min-height: 40px; }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 28px 18px; font-weight: 800; font-size: .95rem; gap: 12px;
  }
  .footer .phones { direction: ltr; letter-spacing: .2em; line-height: 1.5; }
  .footer .addr { line-height: 1.5; }
  .bar { height: 28px; background: var(--orange); }

  @media screen {
    .cell:not([readonly]) { background: #fffaf0; }
    .cell:not([readonly]):hover { background: #fff1d6; }
    .cell::placeholder { color: #b9a47a; font-size: .8rem; }
    .hint { text-align: center; font-size: .85rem; color: #555; padding: 10px 28px 0; }
  }
  @media print { .hint { display: none; } input::placeholder, textarea::placeholder { color: transparent; } }

  /* نسخة التصدير لـ PDF (ثابتة بعرض A4) */
  .sheet.pdf { width: 794px; height: 1123px; min-height: 0; margin: 0; }
  .sheet.pdf input, .sheet.pdf .cell { background: transparent !important; border-bottom-color: transparent !important; }

  /* الطباعة / حفظ PDF */
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet { margin: 0; width: 210mm; height: 297mm; min-height: 0; }
    input, .cell { border-bottom-color: transparent !important; background: transparent !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  @media (max-width: 560px) {
    .header { height: 110px; }
    .logo { width: 110px; height: 110px; }
        .header .slant-orange { transform: translateX(-100px) skewX(12deg); width: 80px; }
    .table-wrap, .meta, .client, .totals, .footer { padding-left: 10px; padding-right: 10px; }
    .header { padding: 0 8px; }
    .header .tagline { max-width: 76px; }
    .header .tagline strong { font-size: .62rem; margin: 0; }
    .header .tagline span { display: none; }
    th { font-size: .75rem; }
    .footer { font-size: .75rem; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<script>
  var ROWS = 10;
  var tbody = document.getElementById('rows');

  // بناء الصفوف
  for (var i = 1; i <= ROWS; i++) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="n">' + i + '</td>' +
      '<td class="item"><textarea class="cell txt" rows="1" placeholder="اكتب المادة" aria-label="المادة ' + i + '"></textarea></td>' +
      '<td><textarea class="cell num qty" dir="ltr" rows="1" inputmode="decimal" placeholder="0" aria-label="الكمية ' + i + '"></textarea></td>' +
      '<td><textarea class="cell num price" dir="ltr" rows="1" inputmode="decimal" placeholder="0" aria-label="سعر المفرد ' + i + '"></textarea></td>' +
      '<td><textarea class="cell num amount" dir="ltr" rows="1" readonly tabindex="-1" aria-label="المبلغ ' + i + '"></textarea></td>' +
      '<td><textarea class="cell txt" rows="1" aria-label="ملاحظات ' + i + '"></textarea></td>';
    tbody.appendChild(tr);
  }

  // تحويل الأرقام العربية للإنجليزية وتنظيفها
  function toNumber(v) {
    var map = { '٠':0,'١':1,'٢':2,'٣':3,'٤':4,'٥':5,'٦':6,'٧':7,'٨':8,'٩':9 };
    v = String(v).replace(/[٠-٩]/g, function (d) { return map[d]; })
                 .replace(/[,٬،\s]/g, '');
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }
  function fmt(n) {
    return n === 0 ? '' : n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  }

  // الحساب التلقائي
  function recalc() {
    var total = 0;
    document.querySelectorAll('#rows tr').forEach(function (tr) {
      var q = toNumber(tr.querySelector('.qty').value);
      var p = toNumber(tr.querySelector('.price').value);
      var a = q * p;
      tr.querySelector('.amount').value = fmt(a);
      total += a;
    });
    document.getElementById('total').value = fmt(total);
  }

  // تكبير الخلية مع الكتابة
  function autosize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }
  // الأرقام: نصغّر الخط شوية، وإذا بعدها كبيرة ينزل سطر
  function fitNum(el) {
    el.style.whiteSpace = 'pre';
    el.style.overflowWrap = 'normal';
    var size = 16;
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > el.clientWidth && size > 10) {
      size--; el.style.fontSize = size + 'px';
    }
    if (el.scrollWidth > el.clientWidth) {
      el.style.whiteSpace = 'pre-wrap';
      el.style.overflowWrap = 'anywhere';
    }
    if (el.tagName === 'TEXTAREA') autosize(el);
  }
  function layoutAll() {
    document.querySelectorAll('#rows .txt').forEach(autosize);
    document.querySelectorAll('#rows .num').forEach(fitNum);
  }

  // فواصل الألوف أثناء الكتابة (للسعر)
  function liveComma(el) {
    var map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9' };
    var pos = el.selectionStart;
    function clean(t) {
      t = t.replace(/[٠-٩]/g, function (d) { return map[d]; });
      return t.replace(/[^0-9.]/g, '');
    }
    var before = clean(el.value.slice(0, pos)).length;
    var c = clean(el.value);
    var dot = c.indexOf('.');
    var ip = dot === -1 ? c : c.slice(0, dot);
    var dp = dot === -1 ? '' : c.slice(dot + 1).replace(/\./g, '');
    ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    var out = ip + (dot === -1 ? '' : '.' + dp);
    el.value = out;
    var count = 0, np = 0;
    while (np < out.length && count < before) {
      if (out.charAt(np) !== ',') count++;
      np++;
    }
    try { el.setSelectionRange(np, np); } catch (e) {}
  }

  document.getElementById('rows').addEventListener('input', function (e) {
    if (e.target.classList.contains('price')) liveComma(e.target);
    recalc();
    layoutAll();
  });
  window.addEventListener('resize', layoutAll);

  // رقم الفاتورة التالي (يُحفظ إذا المتصفح يسمح)
  function loadNo() {
    try { var s = localStorage.getItem('asas_invoice_no'); if (s) return s; } catch (e) {}
    return '0001';
  }
  function saveNo(v) { try { localStorage.setItem('asas_invoice_no', v); } catch (e) {} }
  var invNo = document.getElementById('invNo');
  invNo.value = loadNo();
  invNo.addEventListener('input', function () { saveNo(invNo.value); });

  function nextNo(cur) {
    var n = parseInt(cur, 10);
    if (isNaN(n)) return cur;
    var s = String(n + 1);
    while (s.length < cur.length) s = '0' + s;
    return s;
  }

  // التاريخ: اليوم تلقائياً
  function setToday() {
    var d = new Date();
    document.getElementById('d1').value = d.getDate();
    document.getElementById('d2').value = d.getMonth() + 1;
    document.getElementById('d3').value = d.getFullYear();
  }
  setToday();

  // تنزيل PDF مباشرة
  function fileName() {
    var name = document.getElementById('client').value.trim();
    return 'فاتورة_' + invNo.value + (name ? '_' + name : '') + '.pdf';
  }
  var saveBtn = document.getElementById('saveBtn');
  function resetBtn() { saveBtn.disabled = false; saveBtn.textContent = 'تنزيل PDF'; }
  saveBtn.addEventListener('click', function () {
    if (typeof html2pdf === 'undefined') {
      alert('ما تحمّلت أداة الـ PDF. تأكد من الإنترنت، أو استخدم زر طباعة واختر حفظ كـ PDF.');
      return;
    }
    saveBtn.disabled = true; saveBtn.textContent = 'جاري التنزيل...';
    window.scrollTo(0, 0);

    // ننسخ الفاتورة بعرض ثابت (A4) حتى ما تتأثر بحجم شاشة الموبايل
    var src = document.getElementById('sheet');
    var clone = src.cloneNode(true);
    clone.removeAttribute('id');
    clone.classList.add('pdf');
    var si = src.querySelectorAll('input'), ci = clone.querySelectorAll('input');
    for (var i = 0; i < si.length; i++) {
      ci[i].setAttribute('value', si[i].value);
      ci[i].removeAttribute('placeholder');
    }
    // الخلايا النصية -> عناصر عادية حتى تطلع كاملة بالـ PDF
    var st = src.querySelectorAll('textarea'), ct = clone.querySelectorAll('textarea');
    for (var j = 0; j < st.length; j++) {
      var d = document.createElement('div');
      d.className = ct[j].className;
      d.textContent = st[j].value;
      d.style.whiteSpace = 'pre-wrap';
      ct[j].parentNode.replaceChild(d, ct[j]);
    }
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:0;top:0;width:794px;height:1123px;overflow:hidden;z-index:-1;direction:rtl;background:#fff';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);
    wrap.querySelectorAll('.num').forEach(fitNum);

    function done() { document.body.removeChild(wrap); resetBtn(); }

    html2pdf().set({
      margin: 0,
      filename: fileName(),
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, x: 0, y: 0, scrollX: 0, scrollY: 0, windowWidth: 794, windowHeight: 1123 },
      jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] }
    }).from(clone).save().then(done).catch(function () {
      done();
      alert('صار خطأ بالتنزيل. جرب زر طباعة.');
    });
  });

  // طباعة (احتياط)
  document.getElementById('printBtn').addEventListener('click', function () {
    var old = document.title;
    document.title = fileName().replace('.pdf', '');
    window.print();
    document.title = old;
  });

  // فاتورة جديدة
  document.getElementById('newBtn').addEventListener('click', function () {
    if (!confirm('تمسح البيانات وتبدأ فاتورة جديدة؟')) return;
    document.querySelectorAll('#rows textarea').forEach(function (i) { i.value = ''; });
    document.getElementById('client').value = '';
    document.getElementById('sign').value = '';
    invNo.value = nextNo(invNo.value);
    saveNo(invNo.value);
    setToday();
    recalc();
    layoutAll();
  });
  layoutAll();
</script>
</body>
</html>
